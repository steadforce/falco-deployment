name: Label Renovate hydration

on:
  workflow_run:
    workflows: [Helm hydration]
    types: [completed]
    branches: [main]
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: steadforce/steadops-workflows/.github/workflows/label-renovate-hydration.yaml@1b652a80d36bafbcd7e26068b9f8d8743352a821
    with:
      workflows-ref: 1b652a80d36bafbcd7e26068b9f8d8743352a821
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      helm-version: v3.19.0
      yq-version: v4.49.2
      charts-root: .
      layout: multi-chart
      eligible-update-labels: '["update:patch"]'
