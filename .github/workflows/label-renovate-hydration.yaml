name: Label Renovate hydration
on:
  workflow_run:
    workflows: [Helm hydration]
    types: [completed]
    branches: [main]
  push:
    branches: ['environments/**']
  pull_request:
    branches: ['environments/**']
    types: [synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
jobs:
  label:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: steadforce/steadops-workflows/.github/workflows/label-renovate-hydration.yaml@6b07642d1e40403c9030bbc5ccf3209454dabf67 # add-label-renovate-hydration-workflow
    with:
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      helm-version: v3.19.0
      yq-version: v4.49.2
      charts-root: .
      layout: single-chart
      eligible-update-labels: '["update:patch"]'
