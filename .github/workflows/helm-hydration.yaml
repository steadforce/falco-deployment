name: Helm hydration

on:
  push:
    branches:
    - main
  # run the hydration on demand, e.g. after a hydration PR was merged or closed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  hydration:
    uses: steadforce/steadops-workflows/.github/workflows/helm-hydration.yaml@v4.3.0
