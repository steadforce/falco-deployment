suite: falco custom rules configmap content per cluster
release:
  name: falco
templates:
- charts/falco/templates/rules-configmap.yaml
tests:
- it: renders only the shared custom rules file on non-local clusters
  values:
  - &subchartOverrideValues ../values-subchart-overrides.yaml
  asserts:
  - exists:
      path: &sharedCustomRulesPath data["customized-rules.yaml"]
  - notExists:
      path: &localCustomRulesPath data["customized-local-rules.yaml"]
- it: scopes the Postgres API exception to HTTPS without hard-coding a cluster IP
  values:
  - *subchartOverrideValues
  asserts:
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)k8s\.pod\.name contains "standby-prod-moodle-postgres-cluster" and\s+fd\.rport = 443'
  - notMatchRegex:
      path: *sharedCustomRulesPath
      pattern: 'fd\.rip = "10\.43\.0\.1"'
- it: limits sensitive PAM file reads to rkhunter
  values:
  - *subchartOverrideValues
  asserts:
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.name = "rkhunter" and\s+fd\.name startswith "/etc/pam\.d/"'
  - notMatchRegex:
      path: *sharedCustomRulesPath
      pattern: '\(fd\.name startswith "/etc/pam\.d/"\)'
- it: limits Postgres shell exceptions to known WAL maintenance commands
  values:
  - *subchartOverrideValues
  asserts:
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.pname = "postgres" and\s+proc\.cmdline contains "wal-e\.d/env" and\s+k8s\.ns\.name = "postgres" and\s+\(\s+proc\.cmdline contains "/scripts/restore_command\.sh"'
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.pname = "postgres" and\s+proc\.cmdline contains "wal-e\.d/env" and\s+k8s\.ns\.name = "postgres" and\s+\(.*?proc\.cmdline contains "wal-g wal-push"\s+\)'
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.pname = "postgres" and\s+k8s\.pod\.name contains "standby-prod-moodle-postgres-cluster" and\s+k8s\.ns\.name = "postgres" and\s+evt\.type = execve and\s+proc\.name in \("sh", "bash"\) and\s+proc\.cmdline contains "wal-e\.d/env" and\s+\(\s+proc\.cmdline contains "/scripts/restore_command\.sh" or\s+proc\.cmdline contains "wal-g wal-push"'
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.pexepath startswith "/usr/lib/postgresql/" and\s+k8s\.pod\.name contains "standby-prod-moodle-postgres-cluster" and\s+k8s\.ns\.name = "postgres" and\s+proc\.name in \("sh", "bash"\) and\s+proc\.cmdline contains "wal-e\.d/env" and\s+\(\s+proc\.cmdline contains "/scripts/restore_command\.sh" or\s+proc\.cmdline contains "wal-g wal-push"'
  - notMatchRegex:
      path: *sharedCustomRulesPath
      pattern: 'proc\.name = "postgres" and\s+proc\.cmdline contains "wal-e\.d/env"'
  - notMatchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.pexepath startswith "/usr/lib/postgresql/" and\s+k8s\.ns\.name = "postgres" and\s+proc\.name in \("sh", "bash"\)\s+\)'
  - notMatchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)proc\.pname = "postgres" and\s+k8s\.pod\.name contains "standby-prod-moodle-postgres-cluster" and\s+k8s\.ns\.name = "postgres" and\s+evt\.type = execve and\s+proc\.name in \("sh", "bash"\)\s+\)'
- it: limits clear-log helper processes to rkhunter ancestry
  values:
  - *subchartOverrideValues
  asserts:
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: '(?s)\(proc\.name = "rkhunter" or\s+\(proc\.name in \("cp", "sh"\) and\s+\(proc\.pname = "rkhunter" or proc\.aname\[2\] = "rkhunter"\)\)\) and\s+\(fd\.name startswith "/var/log/rkhunter"'
  - notMatchRegex:
      path: *sharedCustomRulesPath
      pattern: 'proc\.name in \("rkhunter", "cp", "sh"\)'
- it: sets the shared allow-lists and exclusion macros in the custom rules file
  values:
  - *subchartOverrideValues
  asserts:
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: "(?m)^- list: known_drop_and_execute_containers\\n  items: \\[.*gcr\\.io/kaniko-project/executor.*\\]$"
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: "(?m)^- list: read_sensitive_file_images$"
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: "(?m)^- macro: user_known_contact_k8s_api_server_activities$"
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: "(?m)^- macro: user_known_stand_streams_redirect_activities$"
  - matchRegex:
      path: *sharedCustomRulesPath
      pattern: "(?m)^- macro: user_shell_container_exclusions$"
- it: additionally renders the local-only custom rules file on local development
  values:
  - *subchartOverrideValues
  - ../values-local.yaml
  asserts:
  - exists:
      path: *sharedCustomRulesPath
  - exists:
      path: *localCustomRulesPath
- it: appends the local-only exceptions to the shared rules on local development
  values:
  - *subchartOverrideValues
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: *localCustomRulesPath
      pattern: "(?m)^- list: known_drop_and_execute_containers\\n  items: \\[kindest/node\\]$"
  - matchRegex:
      path: *localCustomRulesPath
      pattern: "(?m)^- rule: Drop and execute new binary in container\\n(?:  .*\\n)*?  override:\\n    condition: append$"
  - matchRegex:
      path: *localCustomRulesPath
      pattern: "(?m)^- macro: user_known_contact_k8s_api_server_activities\\n(?:  .*\\n)*?  override:\\n    condition: append$"
