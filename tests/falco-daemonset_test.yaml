suite: falco daemonset container resources per cluster
release:
  name: falco
tests:
- it: matches the local cluster daemonset snapshot
  templates: &daemonsetTemplate
  - charts/falco/templates/daemonset.yaml
  asserts:
  - matchSnapshot: {}
  values: &localValues
  - ../values-local.yaml
- it: sets falco container cpu requests/limits and memory requests to 0 on the local cluster
  templates: *daemonsetTemplate
  values: *localValues
  asserts:
  - matchRegex:
      path: &cpuLimitsPath spec.template.spec.containers[?(@.name == "falco")].resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits
      pattern: &localCpuPattern "^0(m)?$"
  - matchRegex:
      path: &memoryLimitsPath spec.template.spec.containers[?(@.name == "falco")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: &nonZeroMemoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: &cpuRequestsPath spec.template.spec.containers[?(@.name == "falco")].resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests
      pattern: *localCpuPattern
  - matchRegex:
      path: &memoryRequestsPath spec.template.spec.containers[?(@.name == "falco")].resources.requests.memory
      # on local cluster we expect 0, 0Ki, 0Mi, or 0Gi memory requests
      pattern: "^0(Ki|Mi|Gi)?$"
- it: sets non-zero falco container cpu and memory requests and limits on non-local clusters
  templates: *daemonsetTemplate
  values:
  - ../values-subchart-overrides.yaml
  asserts:
  - matchRegex:
      path: *cpuLimitsPath
      # on non-local clusters we expect a non-zero cpu limit
      pattern: &nonZeroCpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: *memoryLimitsPath
      pattern: *nonZeroMemoryPattern
  - matchRegex:
      path: *cpuRequestsPath
      pattern: *nonZeroCpuPattern
  - matchRegex:
      path: *memoryRequestsPath
      pattern: *nonZeroMemoryPattern
